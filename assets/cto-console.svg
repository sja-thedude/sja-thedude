<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">SJA Inc. CTO Console</title>
  <desc id="d">Live architecture map: SJA as founder, CEO and CTO leading SJA Pathway (JPlatform, EPlatform, AIPath), SJA Verse (Ouria) and SJA Robotics (ATIANA, Fari, MOUS). Bootstrapped, 40+ subscribers in 15+ countries, 8 members hired.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080C"/><stop offset="1" stop-color="#0E0F13"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F2430"/>
    </pattern>
    <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".55"/><stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- core → companies -->
    <path id="e1" d="M600 168 C 600 230, 220 220, 220 282"/>
    <path id="e2" d="M600 168 L 600 282"/>
    <path id="e3" d="M600 168 C 600 230, 980 220, 980 282"/>
    <!-- companies → products -->
    <path id="p1" d="M220 330 C 220 380, 110 370, 110 420"/>
    <path id="p2" d="M220 330 L 220 420"/>
    <path id="p3" d="M220 330 C 220 380, 330 370, 330 420"/>
    <path id="p4" d="M600 330 C 600 380, 490 370, 490 420"/>
    <path id="p5" d="M600 330 L 600 420"/>
    <path id="p6" d="M600 330 C 600 380, 710 370, 710 420"/>
    <path id="p7" d="M980 330 C 980 380, 870 370, 870 420"/>
    <path id="p8" d="M980 330 L 980 420"/>
    <path id="p9" d="M980 330 C 980 380, 1090 370, 1090 420"/>
    <!-- Fari ↔ ATIANA Core / MOUS -->
    <path id="x1" d="M955 452 L 895 452"/>
    <path id="x2" d="M1005 452 L 1065 452"/>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
      .edge { fill: none; stroke-width: 1.5; stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24 } }
      .ok { animation: ok 1.6s ease-in-out infinite; } @keyframes ok { 50% { opacity: .25 } }
      .ring { transform-origin: 600px 140px; animation: rot 18s linear infinite; }
      .ring2 { transform-origin: 600px 140px; animation: rot 26s linear infinite reverse; }
      @keyframes rot { to { transform: rotate(360deg) } }
      .tick { animation: tick 12s steps(1) infinite; opacity: 0; }
      @keyframes tick { 0%, 24% { opacity: 1 } 25%, 100% { opacity: 0 } }
      .metric { animation: rise 1s ease-out both; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="599" rx="16" fill="none" stroke="#C9A227" stroke-opacity=".35"/>

  <!-- header -->
  <text x="32" y="44" class="mono" font-size="13" fill="#6B7280">SJA-INC://ops/console</text>
  <text x="32" y="72" class="sans" font-size="26" font-weight="800" fill="#F5F7FA">CTO CONSOLE <tspan fill="#C9A227">·</tspan> <tspan fill="#9CA3AF" font-weight="600" font-size="18">3 companies, 1 architect</tspan></text>
  <g transform="translate(1168 52)" class="mono" font-size="12" text-anchor="end">
    <circle cx="-184" cy="-4" r="5" fill="#34D399" class="ok"/>
    <text x="0" y="0" fill="#34D399">ALL SYSTEMS OPERATIONAL</text>
    <text x="0" y="20" fill="#6B7280">bootstrapped · $0 raised · shipping daily</text>
  </g>

  <!-- core node -->
  <circle cx="600" cy="140" r="78" fill="url(#coreGlow)"/>
  <g class="ring"><circle cx="600" cy="140" r="52" fill="none" stroke="#C9A227" stroke-opacity=".6" stroke-dasharray="2 10"/></g>
  <g class="ring2"><circle cx="600" cy="140" r="62" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-dasharray="40 14"/></g>
  <circle cx="600" cy="140" r="40" fill="#0E0F13" stroke="#C9A227" stroke-width="2.5" filter="url(#glow)"/>
  <text x="600" y="137" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#C9A227">SJA</text>
  <text x="600" y="154" text-anchor="middle" class="mono" font-size="9" fill="#E5E7EB">CEO · CTO</text>

  <!-- rotating decision ticker -->
  <g class="mono" font-size="12">
    <text x="680" y="118" fill="#6B7280">// now deciding</text>
    <text x="680" y="138" class="tick" fill="#E5E7EB" style="animation-delay:0s">› architecture &amp; system design</text>
    <text x="680" y="138" class="tick" fill="#E5E7EB" style="animation-delay:3s">› security, RLS &amp; access control</text>
    <text x="680" y="138" class="tick" fill="#E5E7EB" style="animation-delay:6s">› CI/CD &amp; release quality</text>
    <text x="680" y="138" class="tick" fill="#E5E7EB" style="animation-delay:9s">› hiring, mentoring &amp; roadmap</text>
  </g>
  <g class="mono" font-size="12" text-anchor="end">
    <text x="520" y="118" fill="#6B7280">stack //</text>
    <text x="520" y="138" class="tick" fill="#22D3EE" style="animation-delay:0s">Next.js · TypeScript ‹</text>
    <text x="520" y="138" class="tick" fill="#22D3EE" style="animation-delay:3s">Python · FastAPI · LLMs ‹</text>
    <text x="520" y="138" class="tick" fill="#22D3EE" style="animation-delay:6s">Supabase · PostgreSQL ‹</text>
    <text x="520" y="138" class="tick" fill="#22D3EE" style="animation-delay:9s">Cloudflare · Three.js ‹</text>
  </g>

  <!-- edges -->
  <use href="#e1" class="edge" stroke="#22D3EE" stroke-opacity=".6"/>
  <use href="#e2" class="edge" stroke="#A78BFA" stroke-opacity=".6"/>
  <use href="#e3" class="edge" stroke="#C9A227" stroke-opacity=".6"/>
  <g stroke-opacity=".35">
    <use href="#p1" class="edge" stroke="#22D3EE"/><use href="#p2" class="edge" stroke="#22D3EE"/><use href="#p3" class="edge" stroke="#22D3EE"/>
    <use href="#p4" class="edge" stroke="#A78BFA"/><use href="#p5" class="edge" stroke="#A78BFA"/><use href="#p6" class="edge" stroke="#A78BFA"/>
    <use href="#p7" class="edge" stroke="#C9A227"/><use href="#p8" class="edge" stroke="#C9A227"/><use href="#p9" class="edge" stroke="#C9A227"/>
  </g>
  <use href="#x1" class="edge" stroke="#F472B6" stroke-opacity=".7"/>
  <use href="#x2" class="edge" stroke="#F472B6" stroke-opacity=".7"/>

  <!-- data packets -->
  <g filter="url(#glow)">
    <circle r="4" fill="#22D3EE"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="4" fill="#A78BFA"><animateMotion dur="1.8s" repeatCount="indefinite" begin="-.6s"><mpath href="#e2"/></animateMotion></circle>
    <circle r="4" fill="#C9A227"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1.2s"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3" fill="#22D3EE"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="3" fill="#22D3EE"><animateMotion dur="1.3s" repeatCount="indefinite" begin="-.4s"><mpath href="#p2"/></animateMotion></circle>
    <circle r="3" fill="#22D3EE"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-.9s"><mpath href="#p3"/></animateMotion></circle>
    <circle r="3" fill="#A78BFA"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-.2s"><mpath href="#p4"/></animateMotion></circle>
    <circle r="3" fill="#A78BFA"><animateMotion dur="1.3s" repeatCount="indefinite" begin="-.7s"><mpath href="#p5"/></animateMotion></circle>
    <circle r="3" fill="#A78BFA"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-1.1s"><mpath href="#p6"/></animateMotion></circle>
    <circle r="3" fill="#C9A227"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-.5s"><mpath href="#p7"/></animateMotion></circle>
    <circle r="3" fill="#C9A227"><animateMotion dur="1.3s" repeatCount="indefinite" begin="-1s"><mpath href="#p8"/></animateMotion></circle>
    <circle r="3" fill="#C9A227"><animateMotion dur="1.6s" repeatCount="indefinite" begin="-.3s"><mpath href="#p9"/></animateMotion></circle>
    <circle r="2.5" fill="#F472B6"><animateMotion dur="1s" repeatCount="indefinite"><mpath href="#x1"/></animateMotion></circle>
    <circle r="2.5" fill="#F472B6"><animateMotion dur="1s" repeatCount="indefinite" begin="-.5s"><mpath href="#x2"/></animateMotion></circle>
  </g>

  <!-- company hubs -->
  <g class="sans">
    <g transform="translate(220 306)">
      <rect x="-118" y="-26" width="236" height="52" rx="12" fill="#0A1A20" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="-3" text-anchor="middle" font-size="16" font-weight="800" fill="#22D3EE">SJA PATHWAY</text>
      <text y="15" text-anchor="middle" class="mono" font-size="10" fill="#9CA3AF">AI career &amp; EdTech SaaS</text>
    </g>
    <g transform="translate(600 306)">
      <rect x="-118" y="-26" width="236" height="52" rx="12" fill="#140F24" stroke="#A78BFA" stroke-width="1.5"/>
      <text y="-3" text-anchor="middle" font-size="16" font-weight="800" fill="#A78BFA">SJA VERSE</text>
      <text y="15" text-anchor="middle" class="mono" font-size="10" fill="#9CA3AF">browser 3D game studio</text>
    </g>
    <g transform="translate(980 306)">
      <rect x="-118" y="-26" width="236" height="52" rx="12" fill="#1C1708" stroke="#C9A227" stroke-width="1.5"/>
      <text y="-3" text-anchor="middle" font-size="16" font-weight="800" fill="#C9A227">SJA ROBOTICS</text>
      <text y="15" text-anchor="middle" class="mono" font-size="10" fill="#9CA3AF">humanoid robotics &amp; AI</text>
    </g>
  </g>

  <!-- products -->
  <g class="mono" font-size="12" text-anchor="middle">
    <g fill="#0B0F14" stroke-width="1">
      <rect x="62" y="432" width="96" height="40" rx="8" stroke="#22D3EE"/><rect x="172" y="432" width="96" height="40" rx="8" stroke="#22D3EE"/><rect x="282" y="432" width="96" height="40" rx="8" stroke="#22D3EE"/>
      <rect x="442" y="432" width="96" height="40" rx="8" stroke="#A78BFA"/><rect x="552" y="432" width="96" height="40" rx="8" stroke="#A78BFA"/><rect x="662" y="432" width="96" height="40" rx="8" stroke="#A78BFA"/>
      <rect x="822" y="432" width="96" height="40" rx="8" stroke="#C9A227"/><rect x="932" y="432" width="96" height="40" rx="8" stroke="#F472B6"/><rect x="1042" y="432" width="96" height="40" rx="8" stroke="#C9A227"/>
    </g>
    <g fill="#E5E7EB" font-weight="700">
      <text x="110" y="450">JPlatform</text><text x="220" y="450">EPlatform</text><text x="330" y="450">AIPath</text>
      <text x="490" y="450">Ouria</text><text x="600" y="450">Realtime</text><text x="710" y="450">12 Realms</text>
      <text x="870" y="450">ATIANA</text><text x="980" y="450">Fari</text><text x="1090" y="450">MOUS</text>
    </g>
    <g fill="#6B7280" font-size="9">
      <text x="110" y="464">CV/ATS · jobs</text><text x="220" y="464">86 courses</text><text x="330" y="464">open source</text>
      <text x="490" y="464">3D MMO</text><text x="600" y="464">Durable Objects</text><text x="710" y="464">R3F · Three.js</text>
      <text x="870" y="464">humanoid core</text><text x="980" y="464">reasoning AI</text><text x="1090" y="464">Arabic voice AI</text>
    </g>
    <g>
      <circle cx="150" cy="440" r="3" fill="#34D399" class="ok"/><circle cx="260" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.4s"/><circle cx="370" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.8s"/>
      <circle cx="530" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.2s"/><circle cx="640" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.6s"/><circle cx="750" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-1s"/>
      <circle cx="910" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.3s"/><circle cx="1020" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-.7s"/><circle cx="1130" cy="440" r="3" fill="#34D399" class="ok" style="animation-delay:-1.1s"/>
    </g>
  </g>

  <!-- leadership metrics -->
  <line x1="32" y1="500" x2="1168" y2="500" stroke="#1F2430"/>
  <g class="sans" text-anchor="middle">
    <g transform="translate(127 540)"><text font-size="26" font-weight="800" fill="#C9A227">3</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">COMPANIES LED</text></g>
    <g transform="translate(316 540)"><text font-size="26" font-weight="800" fill="#22D3EE">40+</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">SUBSCRIBERS</text></g>
    <g transform="translate(505 540)"><text font-size="26" font-weight="800" fill="#A78BFA">15+</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">COUNTRIES</text></g>
    <g transform="translate(694 540)"><text font-size="26" font-weight="800" fill="#34D399">8</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">MEMBERS HIRED</text></g>
    <g transform="translate(883 540)"><text font-size="26" font-weight="800" fill="#F472B6">600+</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">CODE REVIEWS</text></g>
    <g transform="translate(1072 540)"><text font-size="26" font-weight="800" fill="#E5E7EB">6+ yrs</text><text y="22" class="mono" font-size="10" fill="#9CA3AF">LEADING ENGINEERING</text></g>
  </g>
</svg>
