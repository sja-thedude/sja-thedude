<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Syeda Juveria Afreen (SJA)</title>
  <desc id="d">Game Developer, Software Engineer and Robotics Engineer. Founder and CEO of SJA Inc.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset=".55" stop-color="#0E0F13"/>
      <stop offset="1" stop-color="#151026"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".35" stop-color="#F5F7FA"/>
      <stop offset=".65" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="300" width="1200" height="140" fill="url(#gridFade)"/></mask>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#A78BFA" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#22D3EE" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbitA" d="M 930 200 m -190 0 a 190 70 0 1 0 380 0 a 190 70 0 1 0 -380 0"/>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .star { fill: #E5E7EB; animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      .role { opacity: 0; animation: role 12s infinite; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
      @keyframes role {
        0% { opacity: 0; transform: translateY(14px); }
        3%, 22% { opacity: 1; transform: translateY(0); }
        25%, 100% { opacity: 0; transform: translateY(-14px); }
      }
      .grid { animation: run 1.2s linear infinite; }
      @keyframes run { from { transform: translateY(0) } to { transform: translateY(20px) } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 930px 200px; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.12); opacity: 1 } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(480px) } }
    </style>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="60" cy="40" r="1.2"/>
    <circle class="star" cx="140" cy="110" r="1" style="animation-delay:-1s"/>
    <circle class="star" cx="230" cy="30" r="1.4" style="animation-delay:-2.2s"/>
    <circle class="star" cx="330" cy="90" r=".9" style="animation-delay:-.6s"/>
    <circle class="star" cx="410" cy="22" r="1.1" style="animation-delay:-3.1s"/>
    <circle class="star" cx="520" cy="70" r="1.3" style="animation-delay:-1.7s"/>
    <circle class="star" cx="600" cy="18" r=".9" style="animation-delay:-2.7s"/>
    <circle class="star" cx="680" cy="120" r="1.2" style="animation-delay:-.3s"/>
    <circle class="star" cx="760" cy="40" r="1" style="animation-delay:-3.6s"/>
    <circle class="star" cx="850" cy="80" r="1.4" style="animation-delay:-1.2s"/>
    <circle class="star" cx="1010" cy="30" r="1" style="animation-delay:-2.4s"/>
    <circle class="star" cx="1090" cy="110" r="1.3" style="animation-delay:-.9s"/>
    <circle class="star" cx="1160" cy="50" r="1" style="animation-delay:-3.3s"/>
    <circle class="star" cx="1130" cy="250" r=".9" style="animation-delay:-1.5s"/>
    <circle class="star" cx="40" cy="220" r="1" style="animation-delay:-2s"/>
    <circle class="star" cx="470" cy="260" r=".8" style="animation-delay:-.4s"/>
    <circle class="star" cx="720" cy="270" r="1" style="animation-delay:-2.9s"/>
    <circle class="star" cx="300" cy="200" r=".8" style="animation-delay:-3.8s"/>
  </g>

  <!-- horizon sun -->
  <ellipse cx="600" cy="305" rx="520" ry="90" fill="url(#sun)"/>

  <!-- synthwave floor -->
  <g mask="url(#gridMask)" stroke="#A78BFA" stroke-width="1" opacity=".55">
    <g class="grid">
      <line x1="0" y1="290" x2="1200" y2="290"/><line x1="0" y1="310" x2="1200" y2="310"/>
      <line x1="0" y1="330" x2="1200" y2="330"/><line x1="0" y1="350" x2="1200" y2="350"/>
      <line x1="0" y1="370" x2="1200" y2="370"/><line x1="0" y1="390" x2="1200" y2="390"/>
      <line x1="0" y1="410" x2="1200" y2="410"/><line x1="0" y1="430" x2="1200" y2="430"/>
    </g>
    <path d="M600 300 L-600 440 M600 300 L-300 440 M600 300 L0 440 M600 300 L200 440 M600 300 L400 440 M600 300 L520 440 M600 300 L600 440 M600 300 L680 440 M600 300 L800 440 M600 300 L1000 440 M600 300 L1200 440 M600 300 L1500 440 M600 300 L1800 440"/>
  </g>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#22D3EE" stroke-opacity=".5"/>

  <!-- left: identity -->
  <g class="mono" font-size="15" fill="#22D3EE">
    <text x="70" y="88">&gt; ./sja --init<tspan class="caret" fill="#C9A227"> _</tspan></text>
  </g>
  <text x="68" y="150" class="sans" font-size="50" font-weight="800" fill="url(#name)" letter-spacing="-.5">Syeda Juveria Afreen</text>
  <text x="70" y="186" class="mono" font-size="18" fill="#C9A227" letter-spacing="6">( S J A )</text>

  <g class="sans" font-size="30" font-weight="700">
    <g class="role r1"><text x="70" y="240" fill="#A78BFA">◆ Game Developer</text></g>
    <g class="role r2"><text x="70" y="240" fill="#22D3EE">◆ Senior Software Engineer</text></g>
    <g class="role r3"><text x="70" y="240" fill="#C9A227">◆ Robotics &amp; AI Engineer</text></g>
    <g class="role r4"><text x="70" y="240" fill="#F472B6">◆ Founder · CEO · CTO</text></g>
  </g>
  <text x="70" y="276" class="mono" font-size="14" fill="#9CA3AF">SJA Inc.  —  Pathway · Verse · Robotics  ·  Jeddah</text>

  <!-- right: orbit system -->
  <g>
    <ellipse cx="930" cy="200" rx="190" ry="70" fill="none" stroke="#22D3EE" stroke-opacity=".25" stroke-dasharray="4 6"/>
    <ellipse cx="930" cy="200" rx="120" ry="44" fill="none" stroke="#C9A227" stroke-opacity=".25"/>
    <circle cx="930" cy="200" r="70" fill="url(#core)" class="pulse"/>
    <circle cx="930" cy="200" r="34" fill="#0E0F13" stroke="#C9A227" stroke-width="2"/>
    <text x="930" y="208" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#C9A227" letter-spacing="1">SJA</text>
    <g fill="none" stroke="#22D3EE" stroke-width="1.5" opacity=".7">
      <circle cx="930" cy="200" r="44">
        <animate attributeName="r" values="36;80" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- gamepad -->
    <g filter="url(#glow)">
      <animateMotion dur="15s" repeatCount="indefinite" begin="0s"><mpath href="#orbitA"/></animateMotion>
      <rect x="-26" y="-15" width="52" height="30" rx="14" fill="#1B1530" stroke="#A78BFA" stroke-width="2"/>
      <path d="M-14 -5 v10 M-19 0 h10" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
      <circle cx="11" cy="-3" r="3" fill="#F472B6"/><circle cx="18" cy="3" r="3" fill="#22D3EE"/>
    </g>
    <!-- code -->
    <g filter="url(#glow)">
      <animateMotion dur="15s" repeatCount="indefinite" begin="-5s"><mpath href="#orbitA"/></animateMotion>
      <rect x="-26" y="-17" width="52" height="34" rx="8" fill="#0B1E24" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#22D3EE">&lt;/&gt;</text>
    </g>
    <!-- robot -->
    <g filter="url(#glow)">
      <animateMotion dur="15s" repeatCount="indefinite" begin="-10s"><mpath href="#orbitA"/></animateMotion>
      <line x1="0" y1="-24" x2="0" y2="-15" stroke="#C9A227" stroke-width="2"/>
      <circle cx="0" cy="-26" r="3" fill="#C9A227"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <rect x="-20" y="-15" width="40" height="30" rx="8" fill="#211B08" stroke="#C9A227" stroke-width="2"/>
      <circle cx="-8" cy="-2" r="4" fill="#22D3EE"/><circle cx="8" cy="-2" r="4" fill="#22D3EE"/>
      <path d="M-8 8 h16" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#22D3EE" opacity=".08"/>
</svg>
