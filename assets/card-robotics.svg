<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="t">
  <title id="t">Robotics Engineer: kinematics, control, computer vision, MATLAB and Simulink</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1708"/><stop offset="1" stop-color="#0E0F13"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#C9A227" stroke-opacity=".12"/>
    </pattern>
    <clipPath id="screen"><rect x="20" y="78" width="360" height="132" rx="10"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#bg)" stroke="#C9A227" stroke-opacity=".5"/>
  <text x="22" y="38" class="sans" font-size="20" font-weight="800" fill="#C9A227">ROBOTICS ENGINEER</text>
  <text x="22" y="60" class="mono" font-size="12" fill="#9CA3AF">Kinematics · Control · Vision · Simulink</text>

  <g clip-path="url(#screen)">
    <rect x="20" y="78" width="360" height="132" fill="#080806"/>
    <rect x="20" y="78" width="360" height="132" fill="url(#grid)"/>
    <!-- lidar sweep -->
    <g transform="translate(320 120)">
      <circle r="30" fill="none" stroke="#22D3EE" stroke-opacity=".3"/>
      <circle r="16" fill="none" stroke="#22D3EE" stroke-opacity=".3"/>
      <path d="M0 0 L30 0 A30 30 0 0 0 21 -21 Z" fill="#22D3EE" fill-opacity=".35">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="-12" cy="9" r="2" fill="#22D3EE"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <!-- conveyor -->
    <rect x="214" y="178" width="70" height="5" fill="#3F3A2A"/>
    <rect x="28" y="178" width="60" height="5" fill="#3F3A2A"/>
    <!-- box being picked -->
    <rect x="-8" y="-7" width="16" height="14" fill="#22D3EE" stroke="#0E7490">
      <animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;.3;.45;.7;.85;1" keyPoints="0;0;0;1;1;1" calcMode="linear" path="M252 170 Q 158 0 64 170"/>
    </rect>
    <!-- arm -->
    <g transform="translate(160 196)">
      <rect x="-26" y="-6" width="52" height="12" rx="3" fill="#3F3A2A" stroke="#C9A227"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="6s" repeatCount="indefinite" values="-35;-35;-35;-145;-145;-35" keyTimes="0;.3;.45;.7;.85;1"/>
        <rect x="0" y="-6" width="64" height="12" rx="6" fill="#C9A227"/>
        <circle r="9" fill="#0E0F13" stroke="#C9A227" stroke-width="3"/>
        <g transform="translate(64 0)">
          <animateTransform attributeName="transform" type="rotate" additive="sum" dur="6s" repeatCount="indefinite" values="55;55;55;-55;-55;55" keyTimes="0;.3;.45;.7;.85;1"/>
          <rect x="0" y="-5" width="48" height="10" rx="5" fill="#E2C35A"/>
          <circle r="7" fill="#0E0F13" stroke="#E2C35A" stroke-width="3"/>
          <path d="M48 -8 h8 v5 M48 8 h8 v-5" stroke="#22D3EE" stroke-width="3" fill="none"/>
        </g>
      </g>
    </g>
    <text x="30" y="98" class="mono" font-size="10" fill="#C9A227">θ₁, θ₂ ← IK(x, y)</text>
    <text x="30" y="112" class="mono" font-size="10" fill="#6B7280">PID · state feedback</text>
  </g>
  <rect x="20" y="78" width="360" height="132" rx="10" fill="none" stroke="#C9A227" stroke-opacity=".5"/>
  <text x="22" y="238" class="mono" font-size="11" fill="#D1D5DB">▶ MEng Robotics @ Stevens · ATIANA humanoid</text>
</svg>
